
name: Cleanup Student Infrastructure

on:
  workflow_dispatch:
    inputs:
      student_suffix:
        description: "STUDENT_SUFFIX used to create AWS resources"
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    name: Destroy Student AWS Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Validate STUDENT_SUFFIX
        env:
          STUDENT_SUFFIX: ${{ inputs.student_suffix }}
        shell: bash
        run: |
          if [[ -z "$STUDENT_SUFFIX" || ! "$STUDENT_SUFFIX" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::STUDENT_SUFFIX is empty or invalid."
            exit 1
          fi
          echo "Student suffix validated."

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Destroy student infrastructure
        env:
          STUDENT_SUFFIX: ${{ inputs.student_suffix }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: bash scripts/destroy.sh "$STUDENT_SUFFIX"

      - name: Cleanup result
        if: success()
        run: echo "The destroy.sh script finished successfully."